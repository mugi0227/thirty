name: Fill App Store listing
# Updates the listing/media or explicitly manages the selected review submission
# in App Store Connect. Runs on Linux; no Mac needed.
# Uses the same secrets as "Upload to App Store Connect".
on:
  workflow_dispatch:
    inputs:
      draft_action:
        description: Update listing/draft, or explicitly submit the selected review draft
        type: choice
        options: [listing, inspect, reopen, finish, submit, withdraw, upload, restore, verify, status, retry-screenshot]
        default: listing
      target_build:
        description: Exact approved build number for draft/review operations
        type: string
        default: ''
      submission_id:
        description: Exact approved submission ID (required for submit/withdraw/upload/restore/verify/status)
        type: string
        default: ''
      media_run_id:
        description: Successful Build iOS run containing the new app-review-media artifact (blank uses committed media)
        type: string
        default: ''
      media:
        description: Replace screenshots and the app preview too
        type: boolean
        default: true
      prepare_review:
        description: Also set price (free), age rating, content rights and attach the newest build
        type: boolean
        default: true
      dry_run:
        description: Only show what would change
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify the selected media run
        if: inputs.draft_action == 'listing' && inputs.media && inputs.media_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_RUN_ID: ${{ inputs.media_run_id }}
        run: |
          [[ "$MEDIA_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MEDIA_RUN_ID" > "$RUNNER_TEMP/media-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'media-run.json').read_text())
          assert run['conclusion'] == 'success', 'Media run must have passed'
          assert run['path'] == '.github/workflows/ios.yml', 'Expected the Build iOS workflow'
          print('Using verified media from', run['html_url'], 'commit', run['head_sha'])
          PY
          rm -rf docs/release/store/iphone-medium docs/release/store/iphone-large docs/release/store/ipad-13
          rm -f docs/release/store/app-preview-iphone-6.9.mp4
      - uses: actions/download-artifact@v5
        if: inputs.draft_action == 'listing' && inputs.media && inputs.media_run_id != ''
        with:
          name: app-review-media
          path: docs/release/store
          run-id: ${{ inputs.media_run_id }}
          github-token: ${{ github.token }}
      - run: python3 -m pip install --quiet "pyjwt[crypto]==2.10.1" requests==2.32.3
      - name: Prepare only the unsubmitted draft
        if: inputs.draft_action == 'inspect' || inputs.draft_action == 'reopen' || inputs.draft_action == 'finish'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DRAFT_ACTION: ${{ inputs.draft_action }}
          DRAFT_BUILD: ${{ inputs.target_build }}
        run: python3 -u scripts/prepare_listing_draft.py "$DRAFT_ACTION" --build "$DRAFT_BUILD" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Apply the approved review media operation
        if: inputs.draft_action == 'withdraw' || inputs.draft_action == 'upload' || inputs.draft_action == 'restore' || inputs.draft_action == 'verify' || inputs.draft_action == 'status' || inputs.draft_action == 'retry-screenshot'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MEDIA_ACTION: ${{ inputs.draft_action }}
          APPROVED_BUILD: ${{ inputs.target_build }}
          APPROVED_SUBMISSION: ${{ inputs.submission_id }}
        run: python3 -u scripts/replace_review_media.py "$MEDIA_ACTION" --build "$APPROVED_BUILD" --submission "$APPROVED_SUBMISSION" ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v5
        if: always() && (inputs.draft_action == 'withdraw' || inputs.draft_action == 'upload' || inputs.draft_action == 'restore' || inputs.draft_action == 'verify' || inputs.draft_action == 'status' || inputs.draft_action == 'retry-screenshot')
        with:
          name: review-media-operation
          path: review-media-operation.json
          retention-days: 30
      - name: Submit the explicitly approved review draft
        if: inputs.draft_action == 'submit'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPROVED_BUILD: ${{ inputs.target_build }}
          APPROVED_SUBMISSION: ${{ inputs.submission_id }}
        run: python3 -u scripts/submit_app_review.py --build "$APPROVED_BUILD" --submission "$APPROVED_SUBMISSION" ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v5
        if: always() && inputs.draft_action == 'submit'
        with:
          name: app-review-submission
          path: app-review-submission.json
          retention-days: 30
      - name: Update App Store Connect
        if: inputs.draft_action == 'listing'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: >-
          python3 scripts/asc_metadata.py release/metadata-ja.json
          ${{ inputs.dry_run && '--dry-run' || '' }} ${{ !inputs.media && '--skip-media' || '' }}
          ${{ inputs.prepare_review && '--prepare-review' || '' }}
