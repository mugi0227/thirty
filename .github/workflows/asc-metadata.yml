name: Inspect App Store configuration
on:
  workflow_dispatch:
    inputs:
      repair_app_availability:
        description: Create missing app availability for the 175 Thirty+ territories (no review submission)
        type: boolean
        default: false
      iap_diagnosis:
        description: Inspect current product pricing and app availability through GET requests
        type: boolean
        default: false
      diagnostic_product:
        description: Separate diagnostic IAP (plan is GET-only; create reserves a new product ID)
        type: choice
        options: [none, plan, create]
        default: none
      plus_english_localization:
        description: English Thirty+ product text (plan is GET-only)
        type: choice
        options: [none, plan, add]
        default: none
      target_build:
        description: Wait for this uploaded build to finish processing (empty skips)
        type: string
        default: '6'
      require_attached:
        description: Also require build 5 to be attached to version 1.0
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet "pyjwt[crypto]==2.10.1" requests==2.32.3
      - name: Inspect App Review readiness through GET requests only
        if: ${{ !inputs.iap_diagnosis && !inputs.repair_app_availability && (inputs.diagnostic_product == 'none' || inputs.diagnostic_product == '') && (inputs.plus_english_localization == 'none' || inputs.plus_english_localization == '') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          REQUIRE_ATTACHED: ${{ inputs.require_attached }}
          TARGET_BUILD: ${{ inputs.target_build }}
        run: python3 -u scripts/check_review_readiness.py
      - name: Set approved app availability and verify it
        if: ${{ inputs.repair_app_availability }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 -u scripts/set_app_availability.py --apply
      - name: Inspect current In-App Purchase catalog through GET requests only
        if: ${{ inputs.iap_diagnosis || inputs.repair_app_availability || inputs.diagnostic_product == 'create' || inputs.plus_english_localization == 'add' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 -u scripts/check_iap_catalog.py
      - name: Plan or create the separate diagnostic product
        if: ${{ inputs.diagnostic_product == 'plan' || inputs.diagnostic_product == 'create' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIAGNOSTIC_ACTION: ${{ inputs.diagnostic_product }}
        run: |
          if [ "$DIAGNOSTIC_ACTION" = create ]; then
            python3 -u scripts/create_diagnostic_iap.py --apply
          else
            python3 -u scripts/create_diagnostic_iap.py
          fi
      - name: Plan or add only the English Thirty+ product text
        if: ${{ inputs.plus_english_localization == 'plan' || inputs.plus_english_localization == 'add' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          LOCALIZATION_ACTION: ${{ inputs.plus_english_localization }}
        run: |
          if [ "$LOCALIZATION_ACTION" = add ]; then
            python3 -u scripts/add_plus_english.py --apply
          else
            python3 -u scripts/add_plus_english.py
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: app-review-readiness
          path: |
            app-review-readiness.json
            iap-catalog-diagnosis.json
            app-availability-verification.json
            diagnostic-iap-plan.json
            diagnostic-iap-result.json
            plus-localization-plan.json
            plus-localization-result.json
          retention-days: 7
