name: Build iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Test deadline and persistence
        working-directory: ios
        run: swift test
      - name: Build unsigned iPhone app
        working-directory: ios
        run: >-
          xcodebuild -project Thirty.xcodeproj -scheme Thirty -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify IPA
        run: python3 scripts/package_ipa.py build/Build/Products/Release-iphoneos/Thirty.app build/Thirty-0.2.0-AltStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Thirty-0.2.0-AltStore
          path: |
            build/*.ipa
            build/*.verification.json
          retention-days: 14
