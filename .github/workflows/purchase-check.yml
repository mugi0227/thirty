name: Check purchases and sound previews
on:
  push:
    branches:
      - codex/purchase-retry
      - codex/purchase-working-product
      - codex/sound-preview
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test product retries and current and legacy purchase entitlements
        working-directory: ios
        run: swift test
      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Compile the Release app and widget
        working-directory: ios
        run: >-
          xcodebuild -project Thirty.xcodeproj -scheme Thirty -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Verify bundled Japanese and English
        run: >-
          swift scripts/ci/check_localizations.swift build/Build/Products/Release-iphoneos/Thirty.app
          build/Build/Products/Release-iphoneos/Thirty.app/PlugIns/ThirtyWidgets.appex
      - name: Build Simulator tests
        working-directory: ios
        run: >-
          xcodebuild -project Thirty.xcodeproj -scheme Thirty -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build-sim
          CODE_SIGNING_ALLOWED=NO build-for-testing -quiet
      - name: Verify sound previews and purchase gates on iPhone and iPad
        working-directory: ios
        run: |
          set -eo pipefail
          mkdir -p ../sound-screenshots
          for device in 'iPhone 17' 'iPad Pro 13-inch (M5)'; do
            udid=$(python3 ../scripts/ci/boot_localization_sim.py "$device" | tail -1)
            slug=$(echo "$device" | tr -cs '[:alnum:]' '-')
            mkdir -p "../sound-screenshots/$slug"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/../sound-screenshots/$slug" \
              xcodebuild -project Thirty.xcodeproj -scheme Thirty -configuration Debug \
              -destination "id=$udid" -derivedDataPath ../build-sim \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -maximum-test-execution-time-allowance 180 \
              -only-testing:ThirtyUITests/SoundPreviewTests \
              -only-testing:ThirtyUITests/LiveActivityAppearanceTests \
              CODE_SIGNING_ALLOWED=NO test-without-building \
              > "../sound-$slug.log" 2>&1
            grep -E 'Test Case.*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)' "../sound-$slug.log"
            if [ "$device" = 'iPhone 17' ]; then
              swift ../scripts/ci/check_island_screenshots.swift "../sound-screenshots/$slug"
            fi
            xcrun simctl shutdown "$udid"
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Thirty-sound-verification
          path: |
            sound-screenshots/
            sound-*.log
          retention-days: 7
