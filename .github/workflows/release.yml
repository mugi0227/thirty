name: Upload to App Store Connect
# Builds, signs and uploads Thirty to App Store Connect (TestFlight) on a
# GitHub-hosted Mac, so no local Mac is needed. Run it from the Actions tab.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   Issuer ID shown above the key list
#   ASC_KEY_P8      Full text of the downloaded AuthKey_XXXX.p8 file
# THIRTY_SIGNING_P12 / THIRTY_SIGNING_PASSWORD hold the reusable distribution
# identity. The API key needs Admin to retrieve or create App Store profiles.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (off = build and sign only)
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: 572NVCGLGQ
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          THIRTY_SIGNING_P12: ${{ secrets.THIRTY_SIGNING_P12 }}
          THIRTY_SIGNING_PASSWORD: ${{ secrets.THIRTY_SIGNING_PASSWORD }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 THIRTY_SIGNING_P12 THIRTY_SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing
      - name: Install the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Install reusable distribution signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          THIRTY_SIGNING_P12: ${{ secrets.THIRTY_SIGNING_P12 }}
          THIRTY_SIGNING_PASSWORD: ${{ secrets.THIRTY_SIGNING_PASSWORD }}
          DESTINATION: ${{ inputs.upload && 'upload' || 'export' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/signing-env"
          "$RUNNER_TEMP/signing-env/bin/pip" install --quiet PyJWT==2.10.1 cryptography==45.0.6 PyYAML==6.0.2
          "$RUNNER_TEMP/signing-env/bin/python" scripts/ci/install_signing.py
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodebuild -version && xcodegen generate
      - name: Archive with the existing distribution identity
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project Thirty.xcodeproj -scheme Thirty -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Thirty.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)"
          test -d "$RUNNER_TEMP/Thirty.xcarchive"
          # Fail early if the build number did not reach the bundles.
          for plist in "$RUNNER_TEMP/Thirty.xcarchive/Products/Applications/Thirty.app/Info.plist" \
                       "$RUNNER_TEMP/Thirty.xcarchive/Products/Applications/Thirty.app/PlugIns/"*.appex/Info.plist; do
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
            echo "$plist: $version"
            test "$version" = "$BUILD_NUMBER"
          done
          /usr/bin/codesign --verify --deep --strict "$RUNNER_TEMP/Thirty.xcarchive/Products/Applications/Thirty.app"
          python3 - "$RUNNER_TEMP/Thirty.xcarchive/Products/Applications/Thirty.app" <<'PY'
          import plistlib, subprocess, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          for bundle in [app, *app.joinpath("PlugIns").glob("*.appex")]:
              identifier = plistlib.loads((bundle / "Info.plist").read_bytes())["CFBundleIdentifier"]
              assert identifier in {"jp.mugilab.thirty", "jp.mugilab.thirty.widgets"}
              entitlements = plistlib.loads(subprocess.check_output(["codesign", "-d", "--entitlements", ":-", str(bundle)]))
              assert entitlements["application-identifier"] == "572NVCGLGQ." + identifier
              assert not entitlements.get("get-task-allow", False)
              assert entitlements.get("beta-reports-active") is True
          print("App and widget distribution entitlements verified")
          PY
      - name: Require the validated app source before upload
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code d4a19b3edeed6bb5ca343fa756fe04b213fc0228 HEAD -- ios
          python3 -u - <<'PY'
          import json, os, time, urllib.request
          run_id = 38727877024
          expected_sha = 'd4a19b3edeed6bb5ca343fa756fe04b213fc0228'
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'
          for attempt in range(60):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              assert result['head_sha'] == expected_sha, 'Unexpected check source'
              print('Required check:', result['status'], result['conclusion'], flush=True)
              if result['status'] == 'completed':
                  assert result['conclusion'] == 'success', 'Checks must pass before uploading'
                  break
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for checks; nothing uploaded')
          PY
      - name: Export and upload
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DESTINATION: ${{ inputs.upload && 'upload' || 'export' }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Thirty.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Thirty-ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build $BUILD_NUMBER: $DESTINATION finished" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          if [ -n "${THIRTY_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$THIRTY_SIGNING_KEYCHAIN"; fi
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: release-logs
          path: ${{ runner.temp }}/archive.log
          retention-days: 7
