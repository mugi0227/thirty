<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thirty</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main id="screen" data-phase="ready">
  <header class="chrome">
    <button class="lock-chip" id="lock" aria-label="アクセスガイドでロックする方法"></button>
    <span class="grow"></span>
    <button class="icon" id="skin" aria-label="スキン"></button>
    <button class="icon" id="dim" aria-label="画面を暗くする" aria-pressed="false"></button>
    <button class="icon" id="rotate" aria-label="横向きにする"></button>
  </header>
  <div class="bars" aria-hidden="true"></div>
  <section class="readout">
    <button class="digits" id="time" aria-label="時間を変更"></button>
    <div class="controls chrome">
      <div class="increments"><button id="add-one" aria-label="1分追加">+1</button><button id="add-ten" aria-label="10分追加">+10</button></div>
      <div class="transport"><button class="stop" id="stop" aria-label="終了" hidden></button><button class="primary" id="action" aria-label="開始"></button></div>
      <div class="finish" id="finish" hidden><button class="again" id="again">もう30分</button><button class="done" id="done">おしまい</button></div>
    </div>
  </section>
  <span class="sr-only" id="status" role="status"></span>
</main>
<aside id="hint" hidden><span class="pulses" aria-hidden="true"><i></i><i></i><i></i></span><span><b>×3</b><small id="hint-name">サイドボタン</small></span><button class="icon" id="close-hint" aria-label="ボタンの案内を閉じる"></button></aside>
<dialog id="help" aria-label="はじめに">
  <div class="modal-header"><button class="icon" id="back-guide" aria-label="前へ"></button><div id="steps"></div><button class="icon" id="close-guide" aria-label="案内を閉じる"></button></div>
  <section id="stage"></section>
  <div class="modal-footer"><button class="next" id="next-guide" autofocus>次へ</button><button class="secondary" id="skip-guide">スキップ</button></div>
</dialog>
<dialog id="time-picker" aria-label="時間を変更">
  <div class="modal-header"><button class="icon" id="cancel-time" aria-label="キャンセル"></button><strong>時間</strong><button class="icon" id="save-time" aria-label="時間を決定"></button></div>
  <div class="presets" id="presets"></div>
  <div class="picker"><label><span>分</span><select id="minutes" aria-label="分"></select></label><span class="sep">:</span><label><span>秒</span><select id="seconds" aria-label="秒"></select></label></div>
</dialog>
<dialog id="skins" aria-label="スキン">
  <div class="modal-header"><span class="icon" aria-hidden="true"></span><strong>スキン</strong><button class="icon" id="close-skins" aria-label="閉じる"></button></div>
  <div class="skins-body">
    <div class="sample big" id="skin-preview"></div>
    <p class="skin-name"><b id="skin-name"></b><span id="skin-detail"></span></p>
    <div class="skin-grid" id="skin-grid"></div>
    <div class="plus-card" id="plus-card">
      <strong>Thirty+</strong>
      <p>すべてのスキンが使えます。<br>買い切りで、定期購入ではありません。</p>
      <button class="next" id="buy">¥480で購入</button>
      <button class="secondary" id="restore">購入を復元</button>
      <small>プレビューでは実際の購入は発生しません。</small>
    </div>
    <p class="thanks" id="thanks" hidden>Thirty+ をご利用いただき、ありがとうございます。</p>
  </div>
</dialog>
<audio id="alarm" src="alarm.wav" preload="auto" hidden></audio>
</body>
</html>
