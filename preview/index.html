<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thirty</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
  <header>
    <button class="icon" id="dim" aria-label="画面を暗くする" aria-pressed="false"></button>
    <button class="icon" id="guide" aria-label="アクセスガイドの説明"></button>
  </header>
  <div class="space-top"></div>
  <div class="device">
    <div class="bars" aria-hidden="true"></div>
    <button class="digits" id="time" aria-label="時間を変更" aria-description="00:00から99:59"></button>
  </div>
  <div class="increments"><button id="add-one" aria-label="1分追加">+1min</button><button id="add-ten" aria-label="10分追加">+10min</button></div>
  <div class="space-bottom"></div>
  <div class="controls"><button class="stop" id="stop" aria-label="終了" hidden></button><button class="primary" id="action" aria-label="開始"></button></div>
  <div class="space-foot"></div>
  <span class="sr-only" id="status" role="status"></span>
</main>
<aside id="hint" hidden><div><span id="hint-name">サイドボタン</span><strong>×3</strong></div><span class="arrow" aria-hidden="true">→</span><button class="icon" id="close-hint" aria-label="ボタンの案内を閉じる"></button></aside>
<dialog id="help" aria-label="アクセスガイドの説明">
  <div class="modal-header"><button class="icon" id="back-guide" aria-label="前へ"></button><button class="icon" id="close-guide" aria-label="案内を閉じる"></button></div>
  <div id="steps" aria-label="1 / 3"></div>
  <section id="stage"></section>
  <button class="next" id="next-guide">次へ</button>
  <button class="secondary" id="skip-guide">あとで</button>
</dialog>
<dialog id="time-picker" aria-label="時間を変更">
  <div class="modal-header"><button class="icon" id="cancel-time" aria-label="キャンセル"></button><button class="icon" id="save-time" aria-label="時間を決定"></button></div>
  <div class="picker"><label><span>分</span><select id="minutes" aria-label="分"></select></label><span>:</span><label><span>秒</span><select id="seconds" aria-label="秒"></select></label></div>
</dialog>
<audio id="alarm" src="alarm.wav" preload="auto" hidden></audio>
</body>
</html>
